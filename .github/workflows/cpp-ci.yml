name: C++17
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.linkage }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 两种库类型必须作为矩阵维度，与三个平台组合生成六个构建任务。
        linkage: [static library, shared library]
        # include 按库类型补充 CMake 的 ON/OFF 参数，不负责展开库类型。
        include:
          - linkage: static library
            shared: "OFF"
          - linkage: shared library
            shared: "ON"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (${{ matrix.linkage }})
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DDLT698_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test codecs, TCP and installed consumer
        run: ctest --test-dir build -C Release --output-on-failure
  core-only:
    name: core-only (no Asio transport)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake (transport OFF)
        run: cmake -S cpp -B build/core -DCMAKE_BUILD_TYPE=Release -DDLT698_BUILD_TRANSPORT=OFF -DDLT698_WARNINGS_AS_ERRORS=OFF
      - name: Build
        run: cmake --build build/core --parallel 2
      - name: Test
        run: ctest --test-dir build/core --output-on-failure
