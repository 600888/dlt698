name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ['v*']
  pull_request:
    paths:
      - VERSION
      - .github/workflows/release.yml
      - cmake/release-package.cmake
  # 手动运行只构建和上传 Actions 产物，便于正式发布前验证。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dlt698-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::VERSION must contain a single X.Y.Z version.'
            exit 1
          fi
          tag="v$version"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "$tag" ]]; then
            echo '::error::Release tag must match VERSION.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    name: ${{ matrix.platform }} / ${{ matrix.linkage }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64-gcc
          - linux-arm64-gcc
          - windows-x64-msvc
          - macos-x64-appleclang
          - macos-arm64-appleclang
        linkage: [static, shared]
        include:
          - linkage: static
            shared: 'OFF'
          - linkage: shared
            shared: 'ON'
          - platform: linux-x64-gcc
            os: ubuntu-22.04
            cmake_args: ''
          - platform: linux-arm64-gcc
            os: ubuntu-22.04-arm
            cmake_args: ''
          - platform: windows-x64-msvc
            os: windows-2022
            cmake_args: '-A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL'
          - platform: macos-x64-appleclang
            os: macos-15-intel
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          - platform: macos-arm64-appleclang
            os: macos-15
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
    steps:
      - uses: actions/checkout@v6
      - name: Configure Release libraries and tests
        run: >-
          cmake -S . -B build/release
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DBUILD_TESTING=ON
          -DDLT698_BUILD_TRANSPORT=ON
          -DDLT698_BUILD_EXAMPLES=OFF
          -DCMAKE_INSTALL_LIBDIR=lib
          ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build/release --config Release --parallel 2
      - name: Test codecs, TCP and relocated installed consumer
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Install and package libraries, headers and CMake exports
        run: >-
          cmake
          -DBUILD_DIR=build/release
          -DOUTPUT_DIR=build/release/packages
          -DPLATFORM=${{ matrix.platform }}
          -DLINKAGE=${{ matrix.linkage }}
          -P cmake/release-package.cmake
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: dlt698-${{ needs.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.linkage }}
          path: build/release/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: [version, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # main 的 VERSION 变更和同版本标签可能同时触发，按版本串行发布。
    concurrency:
      group: dlt698-publish-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dlt698-${{ needs.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Verify all packages and collect checksums
        shell: bash
        working-directory: release-assets
        run: |
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          checksums=(*.sha256)
          if [[ ${#archives[@]} -ne 10 || ${#checksums[@]} -ne 10 ]]; then
            echo '::error::Expected ten packages and ten checksum files.'
            exit 1
          fi
          cat "${checksums[@]}" | sort > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          # 禁止将其他提交生成的产物挂到已有版本标签。
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$RELEASE_COMMIT" ]]; then
              echo '::error::Existing release tag points to a different commit. Bump VERSION.'
              exit 1
            fi
          fi
          if state="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish \
            --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null)"; then
            read -r draft target <<< "$state"
            if [[ "$draft" == false ]]; then
              echo 'Release already published; keeping its assets unchanged.'
              exit 0
            fi
            if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" && [[ "$target" != "$RELEASE_COMMIT" ]]; then
              echo '::error::Existing draft targets a different commit. Bump VERSION.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" \
              --title "dlt698 $RELEASE_TAG" --generate-notes --draft
          fi
          # 先上传至草稿，全部成功后再公开；失败后重跑可继续上传。
          gh release upload "$RELEASE_TAG" release-assets/*.tar.gz \
            release-assets/*.zip release-assets/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
