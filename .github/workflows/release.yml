name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ['v*']
  pull_request:
    paths:
      - VERSION
      - .github/workflows/release.yml
      - pyproject.toml
      - python/**
      - cpp/**
      - tests/vectors/**
      - third/pybind11/**
  # 手动运行只构建和上传 Actions 产物，便于正式发布前验证。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dlt698-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      wheel_matrix: ${{ steps.matrix.outputs.wheel_matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read frozen wheel matrix
        id: matrix
        shell: bash
        run: |
          echo "wheel_matrix=$(python python/tools/release_matrix.py wheel)" >> "$GITHUB_OUTPUT"
      - name: Validate release version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::VERSION must contain a single X.Y.Z version.'
            exit 1
          fi
          tag="v$version"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "$tag" ]]; then
            echo '::error::Release tag must match VERSION.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  python-sdist:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build==1.5.0
      - name: Freeze one source archive for every wheel
        env:
          DLT698_RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: python -m build --sdist
      - run: python python/tools/artifact_check.py dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dlt698-${{ needs.version.outputs.version }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  python-wheels:
    needs: [version, python-sdist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.wheel_matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dlt698-${{ needs.version.outputs.version }}-sdist
          path: source
      - name: Build, repair and test wheels from the frozen sdist
        uses: pypa/cibuildwheel@v3.4.0
        with:
          package-dir: source/dlt698-${{ needs.version.outputs.version }}.tar.gz
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: dlt698-${{ needs.version.outputs.version }}-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: [version, python-sdist, python-wheels]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # main 的 VERSION 变更和同版本标签可能同时触发，按版本串行发布。
    concurrency:
      group: dlt698-publish-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dlt698-${{ needs.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify complete same-version Python artifacts and collect checksums
        shell: bash
        run: |
          python python/tools/joint_manifest.py release-assets --python-only \
            --version '${{ needs.version.outputs.version }}' \
            --commit '${{ needs.version.outputs.commit }}'
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          # 禁止将其他提交生成的产物挂到已有版本标签。
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$RELEASE_COMMIT" ]]; then
              echo '::error::Existing release tag points to a different commit. Bump VERSION.'
              exit 1
            fi
          fi
          if state="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish \
            --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null)"; then
            read -r draft target <<< "$state"
            if [[ "$draft" == false ]]; then
              echo 'Release already published; keeping its assets unchanged.'
              exit 0
            fi
            if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" && [[ "$target" != "$RELEASE_COMMIT" ]]; then
              echo '::error::Existing draft targets a different commit. Bump VERSION.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" \
              --title "dlt698 $RELEASE_TAG" --generate-notes --draft
          fi
          # 先上传至草稿，全部成功后再公开；失败后重跑可继续上传。
          gh release upload "$RELEASE_TAG" release-assets/*.tar.gz \
            release-assets/*.whl \
            release-assets/release-manifest.json release-assets/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  publish-pypi:
    name: Publish Python distributions to PyPI
    if: github.event_name == 'push'
    needs: [version, publish]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/dlt698
    permissions:
      contents: read
      id-token: write
    # 同版本的 main 与标签运行可能先后完成，避免并发上传到 PyPI。
    concurrency:
      group: dlt698-pypi-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download published GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          # 复用已公开的附件，重跑时也不把重新构建的文件混入同一版本。
          gh release download "$RELEASE_TAG" --dir release-assets \
            --pattern '*.whl' --pattern '*.tar.gz' \
            --pattern release-manifest.json --pattern SHA256SUMS
      - name: Verify and stage Python distributions
        shell: bash
        run: |
          # 先核对 Release 原始校验和，再检查完整矩阵及构建身份。
          (cd release-assets && sha256sum --check SHA256SUMS)
          python python/tools/joint_manifest.py release-assets --python-only \
            --version '${{ needs.version.outputs.version }}' \
            --commit '${{ needs.version.outputs.commit }}'
          # PyPI 仅接收发行包，发布清单和校验和保留在 GitHub Release。
          mkdir dist
          cp release-assets/*.whl release-assets/*.tar.gz dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # 部分上传失败后可重跑，也允许同一提交的 main/标签重复触发。
          skip-existing: true
