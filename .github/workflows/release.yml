name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ['v*']
  pull_request:
    paths:
      - VERSION
      - .github/workflows/release.yml
      - cmake/release-package.cmake
      - pyproject.toml
      - python/**
      - cpp/**
      - tests/vectors/**
      - third/pybind11/**
  # 手动运行只构建和上传 Actions 产物，便于正式发布前验证。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dlt698-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    uses: ./.github/workflows/python-ci.yml
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      cpp_matrix: ${{ steps.matrix.outputs.cpp_matrix }}
      wheel_matrix: ${{ steps.matrix.outputs.wheel_matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Read frozen joint matrix
        id: matrix
        shell: bash
        run: |
          echo "cpp_matrix=$(python python/tools/release_matrix.py cpp)" >> "$GITHUB_OUTPUT"
          echo "wheel_matrix=$(python python/tools/release_matrix.py wheel)" >> "$GITHUB_OUTPUT"
      - name: Validate release version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::VERSION must contain a single X.Y.Z version.'
            exit 1
          fi
          tag="v$version"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "$tag" ]]; then
            echo '::error::Release tag must match VERSION.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    name: ${{ matrix.platform }} / ${{ matrix.linkage }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.cpp_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Release libraries and tests
        run: >-
          cmake -S . -B build/release
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DBUILD_TESTING=ON
          -DDLT698_BUILD_TRANSPORT=ON
          -DDLT698_BUILD_EXAMPLES=OFF
          -DCMAKE_INSTALL_LIBDIR=lib
          ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build/release --config Release --parallel 2
      - name: Test codecs, TCP and relocated installed consumer
        run: ctest --test-dir build/release -C Release --output-on-failure
      - name: Install and package libraries, headers and CMake exports
        run: >-
          cmake
          -DBUILD_DIR=build/release
          -DOUTPUT_DIR=build/release/packages
          -DPLATFORM=${{ matrix.platform }}
          -DLINKAGE=${{ matrix.linkage }}
          -P cmake/release-package.cmake
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Record same-source C++ artifact identity
        env:
          DLT698_RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: python python/tools/joint_manifest.py build/release/packages --cpp-record
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: dlt698-${{ needs.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.linkage }}
          path: build/release/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  python-sdist:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install build==1.5.0
      - name: Freeze one source archive for every wheel
        env:
          DLT698_RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: python -m build --sdist
      - run: python python/tools/artifact_check.py dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dlt698-${{ needs.version.outputs.version }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  python-wheels:
    needs: [version, python-sdist]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.wheel_matrix) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dlt698-${{ needs.version.outputs.version }}-sdist
          path: source
      - name: Build, repair and test wheels from the frozen sdist
        uses: pypa/cibuildwheel@v3.4.0
        with:
          package-dir: source/dlt698-${{ needs.version.outputs.version }}.tar.gz
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: dlt698-${{ needs.version.outputs.version }}-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: [version, verification, package, python-sdist, python-wheels]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # main 的 VERSION 变更和同版本标签可能同时触发，按版本串行发布。
    concurrency:
      group: dlt698-publish-${{ needs.version.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dlt698-${{ needs.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify complete same-version joint artifacts and collect checksums
        shell: bash
        run: |
          python python/tools/joint_manifest.py release-assets \
            --version '${{ needs.version.outputs.version }}' \
            --commit '${{ needs.version.outputs.commit }}'
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          # 禁止将其他提交生成的产物挂到已有版本标签。
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$RELEASE_COMMIT" ]]; then
              echo '::error::Existing release tag points to a different commit. Bump VERSION.'
              exit 1
            fi
          fi
          if state="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish \
            --jq '[.isDraft, .targetCommitish] | @tsv' 2>/dev/null)"; then
            read -r draft target <<< "$state"
            if [[ "$draft" == false ]]; then
              echo 'Release already published; keeping its assets unchanged.'
              exit 0
            fi
            if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" && [[ "$target" != "$RELEASE_COMMIT" ]]; then
              echo '::error::Existing draft targets a different commit. Bump VERSION.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" \
              --title "dlt698 $RELEASE_TAG" --generate-notes --draft
          fi
          # 先上传至草稿，全部成功后再公开；失败后重跑可继续上传。
          gh release upload "$RELEASE_TAG" release-assets/*.tar.gz \
            release-assets/*.zip release-assets/*.whl \
            release-assets/release-manifest.json release-assets/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
