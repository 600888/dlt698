[build-system]
requires = ["scikit-build-core==0.11.6"]
build-backend = "backend"
backend-path = ["python/tools"]

[project]
name = "dlt698"
dynamic = ["version"]
description = "Typed Python bindings for the DL/T 698.45 C++ protocol library"
readme = "python/README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
authors = [{name = "dlt698 contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "ruff==0.15.15", "mypy==1.19.1", "build==1.5.0", "pybind11-stubgen==2.5.5", "libclang==18.1.1"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "python"
cmake.build-type = "Release"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/src/dlt698"]
install.components = ["python"]
sdist.include = ["VERSION", "LICENSE", "README.md", "CMakeLists.txt", ".clang-format", "pyproject.toml", "python/**", "cpp/**", "cmake/**", "tests/vectors/**", "third/asio/include/**", "third/asio/LICENSE_1_0.txt", "third/pybind11/include/**", "third/pybind11/tools/**", "third/pybind11/CMakeLists.txt", "third/pybind11/LICENSE", "third/Catch2/**"]
sdist.exclude = ["build/**", "website/**", "plan/**", ".git/**", ".workbuddy/**", "scripts/**", "**/__pycache__/**", "**/*.pyc", "third/spdlog/**", "third/pybind11/tests/**", "third/pybind11/docs/**"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>[0-9]+\\.[0-9]+\\.[0-9]+)\\s*$"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python/src", "python/examples"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-musllinux* *t-*"
# 完整测试集包含 AST 契约检查，隔离的 wheel 测试环境也需要 libclang。
test-requires = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "libclang==18.1.1"]
test-command = "python -m pytest {project}/python/tests"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = {MACOSX_DEPLOYMENT_TARGET = "11.0"}
